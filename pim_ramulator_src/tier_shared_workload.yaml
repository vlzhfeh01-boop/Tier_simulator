Frontend:
  impl: TierDecodeStep
  clock_ratio: 1
  workload_path: ./tier_shared_workload.csv
  shared_channels: true
  shared_region_rows: 8
  softmax_delay_cycles: 0
  sv_drain_cycles: 4
  context_merge_cycles: 2
  non_pim_cycles: 10
  max_cycles: 5000
  Translation:
    impl: NoTranslation
    max_addr: 2147483648

MemorySystem:
  impl: PIMDRAM
  clock_ratio: 1
  DRAM:
    impl: HBM3-PIM
    org:
      preset: HBM3_8Gb_2R
      channel: 16
    timing:
      preset: HBM3_5.2Gbps
  Controller:
    impl: HBM3-PIM
    Scheduler:
      impl: PIM
    RefreshManager:
      impl: No
    plugins:
      - ControllerPlugin:
          impl: HBM3TraceRecorder
          path: ./log/tier_shared_workload/cmd.log
  AddrMapper:
    impl: HBM3-PIM
