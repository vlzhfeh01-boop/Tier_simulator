Frontend:
  impl: TierDecodeStep
  clock_ratio: 1
  channel_a: 2
  channel_b: 5
  prompt_tokens: 33
  softmax_delay_cycles: 0
  Translation:
    impl: NoTranslation
    max_addr: 2147483648

MemorySystem:
  impl: PIMDRAM
  clock_ratio: 1
  DRAM:
    impl: HBM3-PIM
    org:
      preset: HBM3_8Gb_2R
      channel: 16
    timing:
      preset: HBM3_5.2Gbps
  Controller:
    impl: HBM3-PIM
    Scheduler:
      impl: PIM
    RefreshManager:
      impl: No
    plugins:
      - ControllerPlugin:
          impl: HBM3TraceRecorder
          path: ./log/tier_decode_step/cmd.log
  AddrMapper:
    impl: HBM3-PIM
