Frontend:
  impl: TierDecodeStep
  clock_ratio: 1
  workload_path: ./tier_qwen3_row_boundary.csv
  shared_channels: false
  layers_on_hbm: 36
  query_head_count: 32
  kv_head_count: 8
  softmax_delay_cycles: 0
  sv_drain_cycles: 0
  context_merge_cycles: 0
  non_pim_cycles: 0
  max_cycles: 30000000
  Translation:
    impl: NoTranslation
    max_addr: 2147483648

MemorySystem:
  impl: PIMDRAM
  clock_ratio: 1
  DRAM:
    impl: HBM3-PIM
    org:
      preset: HBM3_8Gb_2R
      channel: 16
    timing:
      preset: HBM3_5.2Gbps
  Controller:
    impl: HBM3-PIM
    Scheduler:
      impl: PIM
    RefreshManager:
      impl: No
    plugins:
      - ControllerPlugin:
          impl: HBM3TraceRecorder
          path: ./log/tier_qwen3_row_boundary_tier/cmd.log
  AddrMapper:
    impl: HBM3-PIM
